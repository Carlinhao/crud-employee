version: '3.4'

services:
  db:
    image: mcr.microsoft.com/mssql/rhel/server:2022-latest
    container_name: mssql
    hostname: mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
    restart: always
    ports:
      - "14333:1433"
    networks: 
      - red
  employers-api:
    image: employers-api
    container_name: api
    environment:
        - ASPNETCORE_URLS=http://0.0.0.0:80
        - ASPNETCORE_ENVIRONMENT=Development
        - DB_CONNECTION_STRING=Server=db,14333;Database=BD03;User ID=SA;Password=${DB_PASSWORD}
    build:
      context: .
      dockerfile: src/employers.api/Dockerfile
    ports:
      - "5000:80"
    networks: 
      - red
    depends_on: 
      - db
networks: 
  red:
    driver: bridge
