name: Build and Test

on:
  push:
    branches: 
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Validar prefixo feature/
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH_ORIGEM: ${{ github.head_ref }}
        run: |
          echo "Branch de origem do PR: $BRANCH_ORIGEM"

          if [[ ! "$BRANCH_ORIGEM" =~ ^feature/ ]]; then
            echo "❌ ERRO: Pull Requests para as branches 'master' ou 'develop' precisam vir de uma branch que comece com 'feature/'."
            exit 1
          fi

          echo "✅ Sucesso: O nome da branch segue o padrão permitido."

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.x

      - name: Restore dependencies
        run: dotnet restore employer.solution.sln

      - name: Build
        run: dotnet build employer.solution.sln -c Release --no-restore

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
  
      - name: Test Api
        run: dotnet test test/employer.api.tests -c Release --no-build --verbosity normal --filter "Category!=LongRunning"

      - name: Test Applications
        run: dotnet test test/employer.application.tests -c Release --no-build --verbosity normal --filter "Category!=LongRunning"
